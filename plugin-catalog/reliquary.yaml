known_issues:
  - Linux supports Ubuntu 22.04 or compatible GNU/Linux with glibc 2.35 or newer. macOS requires macOS 15 or newer.
  - On Windows, build the matching native host with scripts/build-native.ps1 before running Hermes memory setup.
  - Hosted embedding requires a Hermes build that supplies the plugin embedding API.
  - Stock Desktop supports browsing. Graph bytes, setup, and writes depend on Desktop SDK and native admission. The web dashboard supports setup and writes.
  - Conversation capture and project routing use trusted Hermes history and project capabilities when available.
  - Imported Memories without accepted source provenance may appear in the dashboard while production recall refuses them.
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_delete
  provides_middleware: []
  requires_env: []
