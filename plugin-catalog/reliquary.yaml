name: reliquary
title: Reliquary
repo: https://github.com/Lokee86/reliquary-hermes
sha: 0ad300940c0d6d77d39ad0078ab0a8674dd421b5
version: "0.3.0"
description: "Local, inspectable long-term memory with source provenance, REL/PHY selection, and an interactive relationship graph. The catalog stages the matching reviewed native host on Linux and macOS. The profile-scoped Rust host reads and writes selected RELs, reads the active PHY, and serves signed loopback requests. Setup provisions a profile-scoped local token through Hermes. Processing and recall use the configured Hermes model endpoints and can incur provider charges. Conversation capture, project attribution, and Desktop graph and write capabilities depend on the Hermes host."
maintainer: Lokee86
tier: community
category: memory
# Proof-only floor. Use the first Hermes release with native assets before submitting this entry.
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Lokee86/reliquary-hermes/releases/tag/v0.3.0
screenshots:
  - https://raw.githubusercontent.com/Lokee86/reliquary-hermes/0ad300940c0d6d77d39ad0078ab0a8674dd421b5/assets/graph-overview.png
readme: true
platforms:
  - windows
  - linux
  - macos
